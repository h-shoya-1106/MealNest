<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>問題15（難易度上）複数画像プレビュー＋並び替え</title>
<link rel="stylesheet" href="../css/style.css" />
<link
    rel="stylesheet"
    href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css"
/>
<style>
  #previewList {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    list-style: none;
    padding: 0;
  }
  #previewList li {
    width: 100px;
    height: 100px;
    border: 1px solid #ccc;
    position: relative;
    cursor: move;
  }
  #previewList img {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }
</style>
</head>
<body>
  <h1>問題15（難易度上）</h1>
  <p>複数画像を選択し、プレビュー表示。ドラッグ＆ドロップで並び替えができます。</p>

  <input type="file" id="imageInput" multiple accept="image/*" />
  <ul id="previewList"></ul>

  <script src="../libs/jquery.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="../js/problem15.js"></script>
</body>
</html>
