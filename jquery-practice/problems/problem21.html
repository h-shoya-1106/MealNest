<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>問題21（難易度上）インライン編集可能なテーブル（保存）</title>
<link rel="stylesheet" href="../css/style.css" />
<style>
  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid #ddd; padding:8px; }
  td.editing { padding:4px; }
  .controls { margin:10px 0; }
  .small { width:120px; }
</style>
</head>
<body>
  <h1>問題21（難易度上）</h1>
  <p>テーブルのセルをダブルクリックするとインラインで編集でき、変更はローカルストレージへ保存されます。</p>

  <div class="controls">
    <input id="itemName" placeholder="アイテム名">
    <input id="itemQty" class="small" type="number" placeholder="数量">
    <button id="addRow">行を追加</button>
  </div>

  <table id="dataTable">
    <thead><tr><th>アイテム</th><th>数量</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="../libs/jquery.min.js"></script>
  <script src="../js/problem21.js"></script>
</body>
</html>
